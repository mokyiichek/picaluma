name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A release pushes main and its tag together; the tag's build covers that commit, so main
    # doesn't build it twice (halving the wait for scarce macOS runners).
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Picaluma 0.')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            rust_targets: ""
            args: "--bundles nsis"
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
          # 32-bit Windows 10 for older PCs (WebView2 has an x86 runtime).
          - platform: windows-latest
            name: windows-x86
            rust_targets: i686-pc-windows-msvc
            args: "--target i686-pc-windows-msvc --bundles nsis"
            artifacts: |
              src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
          - platform: ubuntu-22.04
            name: linux
            rust_targets: ""
            args: "--bundles appimage,deb"
            artifacts: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - platform: macos-latest
            name: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin --bundles app,dmg"
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # Distribution builds must be Developer ID signed and notarized. Pull requests may use
      # tauri.conf.json's ad-hoc identity ("-") because GitHub does not expose repository secrets
      # to untrusted PRs.
      - name: Configure Apple signing
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          require_distribution=0
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) require_distribution=1 ;;
          esac

          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Developer ID signing: enabled"
          elif [ "$require_distribution" -eq 1 ]; then
            echo "::error::Developer ID signing secrets are required for main and tagged builds"
            exit 1
          else
            echo "Developer ID signing: unavailable for pull request — using ad-hoc signature"
            exit 0
          fi

          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            if [ "$require_distribution" -eq 1 ]; then
              echo "::error::Apple notarization credentials are required for main and tagged builds"
              exit 1
            fi
            echo "Notarization: unavailable for pull request"
            exit 0
          fi

          if ! out=$(xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1); then
            reason=$(echo "$out" | tail -3 | tr '\n' ' ')
            if [ "$require_distribution" -eq 1 ]; then
              echo "::error::Apple notarization is unavailable: $reason"
              exit 1
            fi
            # Pull requests may ship unnotarized test builds; don't fail them over an Apple outage.
            echo "::warning::Apple notarization is unavailable, building without it: $reason"
            exit 0
          fi

          {
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "NOTARIZE=1"
          } >> "$GITHUB_ENV"
          echo "Notarization: enabled"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Tagged pushes publish a draft GitHub Release with the installers; other builds upload artifacts.
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Picaluma ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new. Windows - run the setup .exe. macOS - open the .dmg and drag Picaluma to Applications. Linux - AppImage or .deb.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx tauri build ${{ matrix.args }}

      # Fail distribution builds unless Gatekeeper accepts the app and the notarization ticket is
      # stapled. This prevents a signed-but-unnotarized DMG from reaching a release.
      - name: Check macOS signature
        if: matrix.name == 'macos'
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Picaluma.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|Signature|TeamIdentifier|Identifier"
          if [ -n "${NOTARIZE:-}" ]; then
            spctl -a -t exec -vv "$APP"
            xcrun stapler validate "$APP"
          elif [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Distribution build completed without notarization"
            exit 1
          else
            echo "Pull request build: notarization not required"
          fi

      - name: Upload installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: picaluma-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
