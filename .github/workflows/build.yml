name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            rust_targets: ""
            args: "--bundles nsis"
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: ubuntu-22.04
            name: linux
            rust_targets: ""
            args: "--bundles appimage,deb"
            artifacts: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - platform: macos-latest
            name: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin --bundles app,dmg"
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # macOS signing. With the Apple secrets set, builds are signed with the Developer ID and
      # notarized by Apple (no Gatekeeper warnings). Without them, tauri.conf.json's ad-hoc
      # identity ("-") is used, so the app still opens after "Open Anyway" instead of being
      # reported as damaged.
      - name: Configure Apple signing
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Developer ID signing: enabled"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "Notarization: enabled"
            else
              echo "Notarization: skipped (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not set)"
            fi
          else
            echo "Developer ID signing: not configured — using ad-hoc signature"
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Tagged pushes publish a draft GitHub Release with the installers; other builds upload artifacts.
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Picaluma ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new. Windows - run the setup .exe. macOS - open the .dmg and drag Picaluma to Applications. Linux - AppImage or .deb.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx tauri build ${{ matrix.args }}

      # With Developer ID configured, fail the build unless Gatekeeper accepts the notarized app,
      # so an unapproved Mac build is never released.
      - name: Check macOS signature
        if: matrix.name == 'macos'
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Picaluma.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|Signature|TeamIdentifier|Identifier"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            spctl -a -t exec -vv "$APP"
            xcrun stapler validate "$APP"
          else
            spctl -a -t exec -vv "$APP" || echo "Gatekeeper: not notarized (Apple secrets not set)"
          fi

      - name: Upload installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: picaluma-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
