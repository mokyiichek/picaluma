name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            rust_targets: ""
            args: "--bundles nsis"
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            name: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin --bundles app,dmg"
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Tagged pushes publish a draft GitHub Release with the installers; other builds upload artifacts.
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Picaluma ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new. Windows - run the setup .exe. macOS - open the .dmg and drag Picaluma to Applications (first launch - right-click > Open).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx tauri build ${{ matrix.args }}

      - name: Upload installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: picaluma-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
